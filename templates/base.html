{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}QueryFlow{% endblock %} | QueryFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'homepage/img/logo.svg' %}">
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
  </head>
  <body>
    {% include 'includes/navigation.html' %}
    <main class="container py-5">{% block content %}{% endblock %}</main>
    <footer class="container py-4 border-top text-secondary small">
      © <span id="current-year"></span> QueryFlow · Система учёта вопросов и ответов
    </footer>
  </body>
</html>
